name: Release Monograph PDF

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release-pdf:
    name: Build & Publish Monograph PDF Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-science \
            tex-gyre \
            lmodern

      - name: Compile LaTeX monograph and run apparatus gate
        run: python3 scripts/verify_monograph.py --tex-only

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: categorical-reverse-mathematics-pdf
          path: docs/categorical_reverse_mathematics.pdf
          if-no-files-found: error

      - name: Attach PDF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: docs/categorical_reverse_mathematics.pdf
          generate_release_notes: true
