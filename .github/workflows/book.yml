name: Build Monograph PDF

"on":
  push:
    branches:
      - main
    paths:
      - docs/categorical_reverse_mathematics.tex
      - scripts/verify_monograph.py
      - scripts/sync_blueprint.py
      - blueprint/src/content.tex
      - blueprint/lean_decls
      - references.bib
      - .github/workflows/book.yml
  pull_request:
    branches:
      - main
    paths:
      - docs/categorical_reverse_mathematics.tex
      - scripts/verify_monograph.py
      - scripts/sync_blueprint.py
      - blueprint/src/content.tex
      - blueprint/lean_decls
      - references.bib
      - .github/workflows/book.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Compile & Verify Royal Octavo PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-science \
            tex-gyre \
            lmodern

      - name: Compile LaTeX monograph and run apparatus gate
        run: python3 scripts/verify_monograph.py --tex-only

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: categorical-reverse-mathematics-pdf
          path: docs/categorical_reverse_mathematics.pdf
          if-no-files-found: error

      - name: Update Latest GitHub Release PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName --jq .tagName)
          gh release upload "$TAG" docs/categorical_reverse_mathematics.pdf --clobber
